version: '3.8'

services:
  postgres-test:
    image: postgres:15-alpine
    container_name: taqtix-postgres-test
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: taqtix_user
      POSTGRES_PASSWORD: taqtix_password
      POSTGRES_DB: taqtix_test_db
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis-test:
    image: redis:7-alpine
    container_name: taqtix-redis-test
    ports:
      - "6380:6379"
    volumes:
      - redis_test_data:/data
    restart: unless-stopped

volumes:
  postgres_test_data:
  redis_test_data:
